[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "wfrp.character"
description = "Character manager for Warhammer Fantasy Roleplay."
license = "CC-BY-NC-SA-4.0"
license-files = ["docs/LICENSE.md"]
dynamic = ["version"]
requires-python = ">= 3.10"
dependencies = [
    "flask",
    "Flask-SQLAlchemy",
    "flask-wtf",
]
authors = [
    {name = "Michael Davis", email = "m.r.davis@me.com"},
]

[project.optional-dependencies]
testing = [
    "freezegun",
    "pre-commit",
    "pytest",
]

[project.scripts]
wfrp = "wfrp.character.app:main"

[project.urls]
Repository = "https://github.com/davismr/wfrp.character.git"

[tool.setuptools.dynamic]
version = {attr = "wfrp.character.__version__"}

[tool.pytest.ini_options]
testpaths = "tests"

[tool.isort]
profile = "black"
force_single_line = true
force_sort_within_sections = true
